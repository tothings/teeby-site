<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2880, height=1800">
<title>Teeby - App Store Screenshot 3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2880px;
    height: 1800px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #0d9488 0%, #14b8a6 30%, #2dd4bf 60%, #5eead4 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .copy {
    margin-top: 140px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .copy h1 {
    font-size: 120px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.02em;
    line-height: 1.3;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  }

  /* Central area */
  .knowledge-graph {
    position: relative;
    width: 2200px;
    height: 1200px;
    margin-top: 60px;
    z-index: 1;
  }

  /* Connection lines (SVG) */
  .connections {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .connections line {
    stroke: rgba(255, 255, 255, 0.25);
    stroke-width: 3;
    stroke-dasharray: 12, 8;
  }

  /* Center app icon */
  .center-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 300px;
    height: 300px;
    z-index: 2;
  }

  .center-icon-inner {
    width: 300px;
    height: 300px;
    border-radius: 68px;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.2),
      0 0 0 4px rgba(255, 255, 255, 0.3),
      0 0 80px rgba(255, 255, 255, 0.15);
  }

  .center-icon-inner img {
    width: 100%;
    height: 100%;
  }

  /* Glow effect around center */
  .center-icon::before {
    content: '';
    position: absolute;
    top: -40px;
    left: -40px;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
    z-index: -1;
  }

  /* Note cards */
  .note-card {
    position: absolute;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-radius: 20px;
    padding: 32px;
    z-index: 1;
  }

  .note-card .note-title {
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .note-card .note-title .icon {
    font-size: 28px;
  }

  .note-card .note-lines {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .note-card .note-line {
    height: 8px;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.3);
  }

  /* Position each note card */
  .note-card.card-1 {
    top: 40px;
    left: 80px;
    width: 420px;
  }
  .note-card.card-1 .note-line:nth-child(1) { width: 80%; }
  .note-card.card-1 .note-line:nth-child(2) { width: 100%; }
  .note-card.card-1 .note-line:nth-child(3) { width: 65%; }

  .note-card.card-2 {
    top: 20px;
    right: 80px;
    width: 440px;
  }
  .note-card.card-2 .note-line:nth-child(1) { width: 90%; }
  .note-card.card-2 .note-line:nth-child(2) { width: 70%; }
  .note-card.card-2 .note-line:nth-child(3) { width: 85%; }

  .note-card.card-3 {
    top: 380px;
    left: 40px;
    width: 400px;
  }
  .note-card.card-3 .note-line:nth-child(1) { width: 75%; }
  .note-card.card-3 .note-line:nth-child(2) { width: 95%; }
  .note-card.card-3 .note-line:nth-child(3) { width: 60%; }

  .note-card.card-4 {
    top: 400px;
    right: 40px;
    width: 430px;
  }
  .note-card.card-4 .note-line:nth-child(1) { width: 100%; }
  .note-card.card-4 .note-line:nth-child(2) { width: 80%; }
  .note-card.card-4 .note-line:nth-child(3) { width: 70%; }

  .note-card.card-5 {
    bottom: 120px;
    left: 300px;
    width: 380px;
  }
  .note-card.card-5 .note-line:nth-child(1) { width: 85%; }
  .note-card.card-5 .note-line:nth-child(2) { width: 65%; }
  .note-card.card-5 .note-line:nth-child(3) { width: 90%; }

  .note-card.card-6 {
    bottom: 100px;
    right: 280px;
    width: 400px;
  }
  .note-card.card-6 .note-line:nth-child(1) { width: 70%; }
  .note-card.card-6 .note-line:nth-child(2) { width: 100%; }
  .note-card.card-6 .note-line:nth-child(3) { width: 55%; }

  /* Floating particles */
  .particle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.15);
    z-index: 0;
  }
  .particle:nth-child(1) { width: 20px; height: 20px; top: 200px; left: 600px; }
  .particle:nth-child(2) { width: 14px; height: 14px; top: 500px; left: 1200px; }
  .particle:nth-child(3) { width: 18px; height: 18px; top: 800px; right: 500px; }
  .particle:nth-child(4) { width: 12px; height: 12px; top: 300px; right: 700px; }
  .particle:nth-child(5) { width: 16px; height: 16px; bottom: 350px; left: 900px; }
</style>
</head>
<body>
  <div class="copy">
    <h1>使うほどにかしこくなる</h1>
  </div>

  <div class="knowledge-graph">
    <!-- Connection lines from notes to center -->
    <svg class="connections" viewBox="0 0 2200 1200">
      <!-- card-1 to center -->
      <line x1="380" y1="180" x2="1020" y2="520" />
      <!-- card-2 to center -->
      <line x1="1820" y1="160" x2="1180" y2="520" />
      <!-- card-3 to center -->
      <line x1="340" y1="540" x2="1020" y2="580" />
      <!-- card-4 to center -->
      <line x1="1860" y1="560" x2="1180" y2="580" />
      <!-- card-5 to center -->
      <line x1="580" y1="920" x2="1040" y2="680" />
      <!-- card-6 to center -->
      <line x1="1620" y1="940" x2="1160" y2="680" />
    </svg>

    <!-- Floating particles -->
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

    <!-- Center app icon -->
    <div class="center-icon">
      <div class="center-icon-inner">
        <img src="app-icon.png" alt="Teeby">
      </div>
    </div>

    <!-- Note cards -->
    <div class="note-card card-1">
      <div class="note-title"><span class="icon">📋</span>プロジェクト企画書</div>
      <div class="note-lines">
        <div class="note-line"></div>
        <div class="note-line"></div>
        <div class="note-line"></div>
      </div>
    </div>

    <div class="note-card card-2">
      <div class="note-title"><span class="icon">📊</span>マーケティング戦略</div>
      <div class="note-lines">
        <div class="note-line"></div>
        <div class="note-line"></div>
        <div class="note-line"></div>
      </div>
    </div>

    <div class="note-card card-3">
      <div class="note-title"><span class="icon">💡</span>アイデアメモ</div>
      <div class="note-lines">
        <div class="note-line"></div>
        <div class="note-line"></div>
        <div class="note-line"></div>
      </div>
    </div>

    <div class="note-card card-4">
      <div class="note-title"><span class="icon">📝</span>議事録</div>
      <div class="note-lines">
        <div class="note-line"></div>
        <div class="note-line"></div>
        <div class="note-line"></div>
      </div>
    </div>

    <div class="note-card card-5">
      <div class="note-title"><span class="icon">📚</span>リサーチノート</div>
      <div class="note-lines">
        <div class="note-line"></div>
        <div class="note-line"></div>
        <div class="note-line"></div>
      </div>
    </div>

    <div class="note-card card-6">
      <div class="note-title"><span class="icon">🎯</span>タスク管理</div>
      <div class="note-lines">
        <div class="note-line"></div>
        <div class="note-line"></div>
        <div class="note-line"></div>
      </div>
    </div>
  </div>
</body>
</html>
