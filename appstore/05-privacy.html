<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2880, height=1800">
<title>Teeby - App Store Screenshot 5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2880px;
    height: 1800px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #f5f0eb 0%, #e8e0d8 40%, #ddd4ca 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .copy {
    margin-top: 140px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .copy h1 {
    font-size: 110px;
    font-weight: 800;
    color: #2a2a2a;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }

  /* Shield + icon area */
  .shield-area {
    margin-top: 80px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 1;
  }

  .shield {
    position: relative;
    width: 500px;
    height: 580px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .shield svg.shield-svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 500px;
    height: 580px;
  }

  .shield-icon {
    position: relative;
    z-index: 1;
    width: 240px;
    height: 240px;
    border-radius: 54px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
  }

  .shield-icon img {
    width: 100%;
    height: 100%;
  }

  /* Feature badges */
  .badges {
    margin-top: 80px;
    display: flex;
    gap: 48px;
    z-index: 1;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(0, 0, 0, 0.06);
    border-radius: 24px;
    padding: 32px 48px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
  }

  .badge-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .badge-icon svg {
    width: 40px;
    height: 40px;
  }

  .badge-icon.local { background: #e0f2fe; }
  .badge-icon.local svg { stroke: #0284c7; fill: none; }

  .badge-icon.byok { background: #fce7f3; }
  .badge-icon.byok svg { stroke: #db2777; fill: none; }

  .badge-icon.models { background: #ede9fe; }
  .badge-icon.models svg { stroke: #7c3aed; fill: none; }

  .badge-text {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .badge-title {
    font-size: 38px;
    font-weight: 700;
    color: #2a2a2a;
  }

  .badge-desc {
    font-size: 28px;
    font-weight: 400;
    color: #666;
  }

  /* Decorative checkmarks */
  .checks {
    margin-top: 60px;
    display: flex;
    gap: 80px;
    z-index: 1;
  }

  .check-item {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 36px;
    font-weight: 600;
    color: #3a3a3a;
  }

  .check-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #10b981;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .check-circle svg {
    width: 28px;
    height: 28px;
    stroke: white;
    stroke-width: 3;
    fill: none;
  }
</style>
</head>
<body>
  <div class="copy">
    <h1>データは完全ローカル保存で<br>安心あんぜん</h1>
  </div>

  <div class="shield-area">
    <div class="shield">
      <!-- Shield shape -->
      <svg class="shield-svg" viewBox="0 0 500 580" fill="none">
        <path d="M250 20 L470 120 L470 320 C470 450 370 540 250 570 C130 540 30 450 30 320 L30 120 Z"
              fill="rgba(124, 109, 216, 0.08)"
              stroke="rgba(124, 109, 216, 0.25)"
              stroke-width="3"/>
        <path d="M250 50 L440 140 L440 310 C440 425 350 510 250 540 C150 510 60 425 60 310 L60 140 Z"
              fill="rgba(124, 109, 216, 0.04)"
              stroke="rgba(124, 109, 216, 0.12)"
              stroke-width="2"/>
      </svg>

      <!-- App icon inside shield -->
      <div class="shield-icon">
        <img src="app-icon.png" alt="Teeby">
      </div>
    </div>
  </div>

  <div class="badges">
    <div class="badge">
      <div class="badge-icon local">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </div>
      <div class="badge-text">
        <div class="badge-title">完全ローカル保存</div>
        <div class="badge-desc">データはMacのみに保存</div>
      </div>
    </div>

    <div class="badge">
      <div class="badge-icon byok">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </svg>
      </div>
      <div class="badge-text">
        <div class="badge-title">BYOK方式</div>
        <div class="badge-desc">あなたのAPIキーで安心利用</div>
      </div>
    </div>

    <div class="badge">
      <div class="badge-icon models">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="badge-text">
        <div class="badge-title">マルチモデル対応</div>
        <div class="badge-desc">Gemini / Claude から選択</div>
      </div>
    </div>
  </div>

  <div class="checks">
    <div class="check-item">
      <div class="check-circle">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20,6 9,17 4,12"/>
        </svg>
      </div>
      外部サーバーへのアップロードなし
    </div>
    <div class="check-item">
      <div class="check-circle">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20,6 9,17 4,12"/>
        </svg>
      </div>
      機密情報も安心して取り扱い可能
    </div>
  </div>
</body>
</html>
