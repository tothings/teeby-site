<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2880, height=1800">
<title>Teeby - App Store Screenshot 5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2880px;
    height: 1800px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #f5f0eb 0%, #e8e0d8 40%, #ddd4ca 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* 光のパーティクル */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    z-index: 0;
  }
  .glow-1 { width: 400px; height: 400px; background: rgba(16, 185, 129, 0.15); top: -100px; left: 200px; }
  .glow-2 { width: 300px; height: 300px; background: rgba(124, 109, 216, 0.15); bottom: 100px; right: -50px; }
  .glow-3 { width: 350px; height: 350px; background: rgba(59, 130, 246, 0.12); top: 300px; left: -80px; }
  .glow-4 { width: 250px; height: 250px; background: rgba(253, 186, 116, 0.18); bottom: 400px; right: 300px; }

  /* フローティング絵文字 */
  .emoji {
    position: absolute;
    z-index: 4;
    opacity: 0.7;
  }
  .e1 { top: 60px; right: 150px; font-size: 90px; transform: rotate(12deg); }
  .e2 { top: 180px; left: 120px; font-size: 70px; transform: rotate(-15deg); }
  .e3 { bottom: 80px; left: 200px; font-size: 85px; transform: rotate(8deg); }
  .e4 { bottom: 60px; right: 180px; font-size: 65px; transform: rotate(-20deg); }
  .e5 { top: 50%; right: 60px; font-size: 60px; transform: rotate(18deg); opacity: 0.5; }
  .e6 { top: 40%; left: 80px; font-size: 55px; transform: rotate(-10deg); opacity: 0.5; }

  .copy {
    margin-top: 100px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .copy h1 {
    font-size: 120px;
    font-weight: 800;
    color: #2a2a2a;
    letter-spacing: 0.02em;
    line-height: 1.3;
    white-space: pre-line;
  }

  .screenshot-frame {
    margin-top: 80px;
    width: 2400px;
    position: relative;
    z-index: 1;
  }

  .screenshot-frame img {
    width: 100%;
    height: auto;
    border-radius: 16px;
    box-shadow:
      0 40px 80px rgba(0, 0, 0, 0.15),
      0 16px 32px rgba(0, 0, 0, 0.1),
      0 0 0 1px rgba(0, 0, 0, 0.05);
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
  <div class="glow glow-4"></div>

  <div class="emoji e1">🔒</div>
  <div class="emoji e2">🛡️</div>
  <div class="emoji e3">✅</div>
  <div class="emoji e4">🔑</div>
  <div class="emoji e5">💻</div>
  <div class="emoji e6">🏠</div>

  <div class="copy">
    <h1>データは完全ローカル保存で
安心あんぜん</h1>
  </div>

  <div class="screenshot-frame">
    <img src="../../fastlane/screenshots/raw/05.png" alt="Privacy Settings">
  </div>
</body>
</html>
