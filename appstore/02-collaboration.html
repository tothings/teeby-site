<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2880, height=1800">
<title>Teeby - App Store Screenshot 2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2880px;
    height: 1800px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #4a3cb5 0%, #6c5ce7 30%, #a29bfe 70%, #7c6dd8 100%);
    position: relative;
  }

  /* 光のパーティクル */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 0;
  }
  .glow-1 { width: 500px; height: 500px; background: rgba(255, 255, 255, 0.12); top: -150px; left: -100px; }
  .glow-2 { width: 350px; height: 350px; background: rgba(196, 181, 253, 0.25); bottom: -80px; left: 200px; }
  .glow-3 { width: 400px; height: 400px; background: rgba(165, 180, 252, 0.15); top: 300px; left: -50px; }

  /* フローティング絵文字（左側フェードエリアに配置） */
  .emoji {
    position: absolute;
    z-index: 4;
    opacity: 0.8;
  }
  .e1 { top: 100px; left: 80px; font-size: 90px; transform: rotate(-12deg); }
  .e2 { bottom: 120px; left: 150px; font-size: 80px; transform: rotate(15deg); }
  .e3 { top: 45%; left: 50px; font-size: 70px; transform: rotate(-20deg); opacity: 0.6; }
  .e4 { top: 200px; left: 400px; font-size: 60px; transform: rotate(8deg); opacity: 0.5; }
  .e5 { bottom: 300px; left: 80px; font-size: 55px; transform: rotate(-5deg); opacity: 0.5; }

  .screenshot {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 2700px;
    height: auto;
    border-radius: 20px;
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.3),
      0 0 0 1px rgba(0, 0, 0, 0.08);
  }

  .fade-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      to right,
      rgba(74, 60, 181, 1) 0%,
      rgba(74, 60, 181, 0.97) 15%,
      rgba(108, 92, 231, 0.85) 30%,
      rgba(108, 92, 231, 0.4) 45%,
      transparent 60%
    );
    z-index: 2;
  }

  .copy {
    position: absolute;
    top: 50%;
    left: 160px;
    transform: translateY(-50%);
    z-index: 3;
    max-width: 1100px;
  }

  .copy h1 {
    font-size: 130px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.02em;
    line-height: 1.25;
    white-space: pre-line;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <div class="emoji e1">💬</div>
  <div class="emoji e2">📝</div>
  <div class="emoji e3">✨</div>
  <div class="emoji e4">🤝</div>
  <div class="emoji e5">📄</div>

  <img class="screenshot" src="../../fastlane/screenshots/raw/02.png" alt="AI Chat">
  <div class="fade-overlay"></div>
  <div class="copy">
    <h1>AIとの共同作業で
楽々ドキュメント作成</h1>
  </div>
</body>
</html>
