<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2880, height=1800">
<title>Teeby - App Store Screenshot 2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2880px;
    height: 1800px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #4a3cb5 0%, #6c5ce7 30%, #a29bfe 70%, #7c6dd8 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Decorative background circles */
  body::before {
    content: '';
    position: absolute;
    top: -200px;
    right: -200px;
    width: 800px;
    height: 800px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
  }
  body::after {
    content: '';
    position: absolute;
    bottom: -100px;
    left: -100px;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.03);
  }

  .copy {
    margin-top: 140px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .copy h1 {
    font-size: 110px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.02em;
    line-height: 1.3;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
  }

  .illustration {
    margin-top: 100px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 100px;
    position: relative;
    z-index: 1;
  }

  /* User side */
  .user-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .user-icon {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border: 3px solid rgba(255, 255, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .user-icon svg {
    width: 140px;
    height: 140px;
    fill: #fff;
  }

  .side-label {
    font-size: 48px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.9);
  }

  /* Document in the middle */
  .document-flow {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .arrows {
    display: flex;
    align-items: center;
    gap: 60px;
  }

  .arrow {
    width: 160px;
    height: 6px;
    background: rgba(255, 255, 255, 0.5);
    position: relative;
  }

  .arrow::after {
    content: '';
    position: absolute;
    right: -4px;
    top: -12px;
    border: 15px solid transparent;
    border-left: 20px solid rgba(255, 255, 255, 0.5);
  }

  .arrow.left::after {
    left: -4px;
    right: auto;
    border-left: none;
    border-right: 20px solid rgba(255, 255, 255, 0.5);
  }

  .document-icon {
    width: 320px;
    height: 400px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    border: 3px solid rgba(255, 255, 255, 0.25);
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    padding: 40px;
    gap: 24px;
  }

  .doc-line {
    height: 12px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.4);
  }
  .doc-line:nth-child(1) { width: 70%; }
  .doc-line:nth-child(2) { width: 100%; }
  .doc-line:nth-child(3) { width: 85%; }
  .doc-line:nth-child(4) { width: 90%; }
  .doc-line:nth-child(5) { width: 60%; }
  .doc-line:nth-child(6) { width: 95%; }
  .doc-line:nth-child(7) { width: 75%; }
  .doc-line:nth-child(8) { width: 80%; }

  .doc-label {
    font-size: 40px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.8);
    text-align: center;
    margin-top: 16px;
  }

  /* AI side */
  .ai-side {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .ai-icon {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    border: 3px solid rgba(255, 255, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .ai-icon img {
    width: 200px;
    height: 200px;
    border-radius: 36px;
  }

  /* Bottom chat bubbles */
  .chat-preview {
    position: absolute;
    bottom: 100px;
    display: flex;
    gap: 60px;
    z-index: 1;
  }

  .bubble {
    padding: 32px 48px;
    border-radius: 28px;
    font-size: 36px;
    font-weight: 500;
    max-width: 700px;
  }

  .bubble.user-bubble {
    background: rgba(255, 255, 255, 0.25);
    color: #fff;
    border-bottom-left-radius: 8px;
  }

  .bubble.ai-bubble {
    background: rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.9);
    border-bottom-right-radius: 8px;
  }
</style>
</head>
<body>
  <div class="copy">
    <h1>AIとの共同作業で<br>楽々ドキュメント作成</h1>
  </div>

  <div class="illustration">
    <div class="user-side">
      <div class="user-icon">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
      <div class="side-label">あなた</div>
    </div>

    <div class="document-flow">
      <div class="arrows">
        <div class="arrow"></div>
        <div class="arrow left"></div>
      </div>
      <div class="document-icon">
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
        <div class="doc-line"></div>
      </div>
      <div class="doc-label">ドキュメント</div>
    </div>

    <div class="ai-side">
      <div class="ai-icon">
        <img src="app-icon.png" alt="Teeby AI">
      </div>
      <div class="side-label">Teeby AI</div>
    </div>
  </div>

  <div class="chat-preview">
    <div class="bubble user-bubble">「この内容を表形式にまとめて」</div>
    <div class="bubble ai-bubble">「表形式に整理しました ✓」</div>
  </div>
</body>
</html>
