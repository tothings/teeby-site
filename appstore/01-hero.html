<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2880, height=1800">
<title>Teeby - App Store Screenshot 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2880px;
    height: 1800px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #faf7f2 0%, #f0e8dd 40%, #e8ddd0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* 光のパーティクル */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    z-index: 0;
  }
  .glow-1 { width: 400px; height: 400px; background: rgba(162, 155, 254, 0.2); top: -100px; right: 200px; }
  .glow-2 { width: 300px; height: 300px; background: rgba(253, 186, 116, 0.25); bottom: 100px; left: -50px; }
  .glow-3 { width: 350px; height: 350px; background: rgba(134, 239, 172, 0.18); top: 400px; right: -80px; }
  .glow-4 { width: 250px; height: 250px; background: rgba(252, 165, 165, 0.2); bottom: 400px; left: 300px; }

  /* フローティング絵文字 */
  .emoji {
    position: absolute;
    z-index: 4;
    font-size: 80px;
    opacity: 0.7;
  }
  .e1 { top: 60px; left: 120px; font-size: 90px; transform: rotate(-15deg); }
  .e2 { top: 180px; right: 150px; font-size: 70px; transform: rotate(12deg); }
  .e3 { bottom: 80px; right: 200px; font-size: 85px; transform: rotate(-8deg); }
  .e4 { bottom: 60px; left: 180px; font-size: 65px; transform: rotate(20deg); }
  .e5 { top: 50%; left: 60px; font-size: 60px; transform: rotate(-25deg); opacity: 0.5; }
  .e6 { top: 40%; right: 80px; font-size: 55px; transform: rotate(18deg); opacity: 0.5; }

  .copy {
    margin-top: 100px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .copy h1 {
    font-size: 120px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: 0.02em;
    line-height: 1.3;
    white-space: pre-line;
  }

  .screenshot-frame {
    margin-top: 80px;
    width: 2400px;
    position: relative;
    z-index: 1;
  }

  .screenshot-frame img {
    width: 100%;
    height: auto;
    border-radius: 16px;
    box-shadow:
      0 40px 80px rgba(0, 0, 0, 0.15),
      0 16px 32px rgba(0, 0, 0, 0.1),
      0 0 0 1px rgba(0, 0, 0, 0.05);
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
  <div class="glow glow-4"></div>

  <div class="emoji e1">✏️</div>
  <div class="emoji e2">💡</div>
  <div class="emoji e3">✨</div>
  <div class="emoji e4">📝</div>
  <div class="emoji e5">🤖</div>
  <div class="emoji e6">📚</div>

  <div class="copy">
    <h1>だれでも簡単に使えるAIノート</h1>
  </div>

  <div class="screenshot-frame">
    <img src="../../fastlane/screenshots/raw/01.png" alt="Teeby App Screenshot">
  </div>
</body>
</html>
