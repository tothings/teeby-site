<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2880, height=1800">
<title>Teeby - App Store Screenshot 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2880px;
    height: 1800px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #faf7f2 0%, #f0e8dd 40%, #e8ddd0 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .copy {
    margin-top: 120px;
    text-align: center;
  }

  .copy h1 {
    font-size: 120px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: 0.02em;
    line-height: 1.3;
  }

  .copy .sub {
    font-size: 52px;
    font-weight: 500;
    color: #555;
    margin-top: 24px;
  }

  .screenshot-container {
    margin-top: 80px;
    position: relative;
    width: 2400px;
    height: 1300px;
  }

  .screenshot-container img {
    width: 100%;
    height: auto;
    border-radius: 24px;
    box-shadow:
      0 40px 80px rgba(0, 0, 0, 0.15),
      0 16px 32px rgba(0, 0, 0, 0.1),
      0 0 0 1px rgba(0, 0, 0, 0.05);
  }

  /* Placeholder when screenshot is not yet provided */
  .placeholder {
    width: 100%;
    height: 1300px;
    border-radius: 24px;
    background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
    box-shadow:
      0 40px 80px rgba(0, 0, 0, 0.15),
      0 16px 32px rgba(0, 0, 0, 0.1),
      0 0 0 1px rgba(0, 0, 0, 0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 48px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="copy">
    <h1>だれでも簡単に使えるAIノート</h1>
  </div>

  <div class="screenshot-container">
    <!-- screenshot-hero.png をこのディレクトリに配置してください -->
    <img src="screenshot-hero.png" alt="Teeby App Screenshot"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="placeholder" style="display:none;">
      screenshot-hero.png をここに配置
    </div>
  </div>
</body>
</html>
