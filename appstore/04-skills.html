<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=2880, height=1800">
<title>Teeby - App Store Screenshot 4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 2880px;
    height: 1800px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #1a1040 0%, #2d1b69 30%, #3b2280 60%, #241454 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* Subtle grid pattern */
  body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image:
      radial-gradient(circle at 20% 80%, rgba(124, 109, 216, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(162, 155, 254, 0.1) 0%, transparent 50%);
    z-index: 0;
  }

  .copy {
    margin-top: 140px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .copy h1 {
    font-size: 110px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.02em;
    line-height: 1.3;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  /* Skills layout */
  .skills-area {
    position: relative;
    width: 2000px;
    height: 1200px;
    margin-top: 60px;
    z-index: 1;
  }

  /* Center app icon */
  .center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    z-index: 2;
  }

  .center-icon {
    width: 320px;
    height: 320px;
    border-radius: 72px;
    overflow: hidden;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.3),
      0 0 0 4px rgba(255, 255, 255, 0.15),
      0 0 120px rgba(124, 109, 216, 0.3);
  }

  .center-icon img {
    width: 100%;
    height: 100%;
  }

  /* Orbit ring */
  .orbit {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -55%);
    width: 900px;
    height: 900px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.08);
    z-index: 0;
  }

  .orbit-2 {
    width: 700px;
    height: 700px;
    border: 2px dashed rgba(255, 255, 255, 0.06);
  }

  /* Skill cards */
  .skill {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    z-index: 2;
  }

  .skill-icon-container {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
  }

  .skill-icon {
    width: 100px;
    height: 100px;
  }

  .skill-label {
    font-size: 36px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.9);
    white-space: nowrap;
  }

  /* Connection lines from skill to center */
  .skill-line {
    position: absolute;
    z-index: 0;
  }

  .skill-line line {
    stroke: rgba(255, 255, 255, 0.1);
    stroke-width: 2;
  }

  /* Individual skill positions (circular layout) */
  .skill-1 { top: 20px; left: 50%; transform: translateX(-50%); }
  .skill-1 .skill-icon-container { background: rgba(59, 130, 246, 0.25); }

  .skill-2 { top: 200px; right: 60px; }
  .skill-2 .skill-icon-container { background: rgba(236, 72, 153, 0.25); }

  .skill-3 { bottom: 200px; right: 100px; }
  .skill-3 .skill-icon-container { background: rgba(245, 158, 11, 0.25); }

  .skill-4 { bottom: 80px; left: 50%; transform: translateX(-50%); }
  .skill-4 .skill-icon-container { background: rgba(16, 185, 129, 0.25); }

  .skill-5 { bottom: 200px; left: 100px; }
  .skill-5 .skill-icon-container { background: rgba(139, 92, 246, 0.25); }

  .skill-6 { top: 200px; left: 60px; }
  .skill-6 .skill-icon-container { background: rgba(244, 63, 94, 0.25); }
</style>
</head>
<body>
  <div class="copy">
    <h1>多彩なスキルを持つAIエージェント</h1>
  </div>

  <div class="skills-area">
    <!-- Orbit rings -->
    <div class="orbit"></div>
    <div class="orbit orbit-2"></div>

    <!-- Connection lines -->
    <svg class="skill-line" style="position:absolute;top:0;left:0;width:100%;height:100%;" viewBox="0 0 2000 1200">
      <line x1="1000" y1="260" x2="1000" y2="440" />
      <line x1="1700" y1="400" x2="1160" y2="500" />
      <line x1="1660" y1="800" x2="1160" y2="600" />
      <line x1="1000" y1="840" x2="1000" y2="680" />
      <line x1="340" y1="800" x2="840" y2="600" />
      <line x1="300" y1="400" x2="840" y2="500" />
    </svg>

    <!-- Center app icon -->
    <div class="center">
      <div class="center-icon">
        <img src="app-icon.png" alt="Teeby">
      </div>
    </div>

    <!-- Skills -->
    <div class="skill skill-1">
      <div class="skill-icon-container">
        <svg class="skill-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          <path d="M11 3a8 8 0 0 1 0 16"/>
        </svg>
      </div>
      <div class="skill-label">Web検索</div>
    </div>

    <div class="skill skill-2">
      <div class="skill-icon-container">
        <svg class="skill-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
          <polyline points="14,2 14,8 20,8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      <div class="skill-label">ドキュメント作成</div>
    </div>

    <div class="skill skill-3">
      <div class="skill-icon-container">
        <svg class="skill-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
        </svg>
      </div>
      <div class="skill-label">ファイル添付</div>
    </div>

    <div class="skill skill-4">
      <div class="skill-icon-container">
        <svg class="skill-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </div>
      <div class="skill-label">音声入力</div>
    </div>

    <div class="skill skill-5">
      <div class="skill-icon-container">
        <svg class="skill-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
          <path d="M8 8h6M8 12h4"/>
        </svg>
      </div>
      <div class="skill-label">ノート検索</div>
    </div>

    <div class="skill skill-6">
      <div class="skill-icon-container">
        <svg class="skill-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21,15 16,10 5,21"/>
        </svg>
      </div>
      <div class="skill-label">画像認識</div>
    </div>
  </div>
</body>
</html>
