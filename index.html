<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="shortcut icon" href="/favicon.ico">
    <title>Teeby - AI Notes for macOS</title>
    <meta name="description" content="Teeby is a secure AI note app for macOS. Redirecting to your language...">
    <link rel="canonical" href="https://teeby.nanakumi.net/en/">
    <link rel="alternate" hreflang="ja" href="https://teeby.nanakumi.net/ja/">
    <link rel="alternate" hreflang="en" href="https://teeby.nanakumi.net/en/">
    <link rel="alternate" hreflang="ko" href="https://teeby.nanakumi.net/ko/">
    <link rel="alternate" hreflang="de" href="https://teeby.nanakumi.net/de/">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LE75FD70EP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LE75FD70EP');
    </script>
    <noscript>
        <meta http-equiv="refresh" content="0;url=/en/">
    </noscript>
    <script>
        (() => {
            var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
            var map = {
                'ja': '/ja/', 'ko': '/ko/', 'de': '/de/', 'es': '/es/',
                'fr': '/fr/', 'it': '/it/', 'ru': '/ru/', 'pt': '/pt-BR/',
                'hi': '/hi/', 'zh': '/zh-CN/'
            };
            var dest = '/en/';
            for (var prefix in map) {
                if (lang.startsWith(prefix)) { dest = map[prefix]; break; }
            }
            window.location.replace(dest);
        })();
    </script>
</head>
<body>
    <p>Redirecting... <a href="/en/">Click here if not redirected</a></p>
</body>
</html>
